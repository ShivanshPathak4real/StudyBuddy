<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBuddy AI — Your CS Mentor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ═══════════════════════════════════════
       ANIMATED BACKGROUND GRID
  ═══════════════════════════════════════ -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--blue" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--purple" aria-hidden="true"></div>

  <!-- ═══════════════════════════════════════
       MAIN LAYOUT
  ═══════════════════════════════════════ -->
  <div class="app-shell">

    <!-- ── SIDEBAR ──────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="13" stroke="url(#grad1)" stroke-width="2"/>
            <path d="M9 10h10M9 14h7M9 18h5" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="20" cy="18" r="3" fill="url(#grad1)"/>
            <defs>
              <linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#818cf8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <span class="brand-name">StudyBuddy</span>
          <span class="brand-tag">AI Mentor</span>
        </div>
      </div>

      <nav class="sidebar__nav">
        <p class="sidebar__section-label">Quick Actions</p>
        <button class="quick-btn" data-query="Learn Python">
          <span class="quick-btn__icon">🐍</span> Learn Python
        </button>
        <button class="quick-btn" data-query="Learn DSA">
          <span class="quick-btn__icon">📊</span> Learn DSA
        </button>
        <button class="quick-btn" data-query="Learn AI">
          <span class="quick-btn__icon">🤖</span> Learn AI
        </button>
        <button class="quick-btn" data-query="Machine Learning">
          <span class="quick-btn__icon">🧠</span> Learn ML
        </button>
        <button class="quick-btn" data-query="Web Development">
          <span class="quick-btn__icon">🌐</span> Web Dev
        </button>
        <button class="quick-btn" data-query="Study Tips">
          <span class="quick-btn__icon">📚</span> Study Tips
        </button>
        <button class="quick-btn" data-query="Motivate me">
          <span class="quick-btn__icon">🔥</span> Motivation
        </button>
        <button class="quick-btn" data-query="Tell me a joke">
          <span class="quick-btn__icon">😄</span> Tell a Joke
        </button>
        <button class="quick-btn" data-query="Fun fact">
          <span class="quick-btn__icon">🤯</span> Fun Fact
        </button>

        <p class="sidebar__section-label" style="margin-top: 1.5rem;">Topics</p>
        <button class="quick-btn quick-btn--sm" data-query="Git">Git & GitHub</button>
        <button class="quick-btn quick-btn--sm" data-query="JavaScript">JavaScript</button>
        <button class="quick-btn quick-btn--sm" data-query="Java">Java</button>
        <button class="quick-btn quick-btn--sm" data-query="C++">C++</button>
        <button class="quick-btn quick-btn--sm" data-query="SQL">SQL</button>
        <button class="quick-btn quick-btn--sm" data-query="Operating Systems">OS</button>
        <button class="quick-btn quick-btn--sm" data-query="DBMS">DBMS</button>
        <button class="quick-btn quick-btn--sm" data-query="Computer Networks">Networks</button>
        <button class="quick-btn quick-btn--sm" data-query="OOP">OOP</button>
        <button class="quick-btn quick-btn--sm" data-query="Deep Learning">Deep Learning</button>
      </nav>

      <div class="sidebar__footer">
        <button class="btn-clear" id="clearBtn" title="Clear conversation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Clear Chat
        </button>
        <p class="sidebar__credits">Rule-based · Python · Flask</p>
      </div>
    </aside>

    <!-- ── MAIN CHAT AREA ───────────────────────────── -->
    <main class="chat-area">

      <!-- Header -->
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="chat-header__info">
          <span class="status-dot" aria-label="Online"></span>
          <span class="chat-header__name">StudyBuddy AI</span>
          <span class="chat-header__subtitle">Your 24/7 CS Mentor</span>
        </div>
        <button class="btn-clear btn-clear--header" id="clearBtnHeader" title="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </header>

      <!-- Messages Container -->
      <div class="messages" id="messages" role="log" aria-live="polite">

        <!-- Welcome Screen (shown when no messages) -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-icon">
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="28" cy="28" r="27" stroke="url(#wg)" stroke-width="2" opacity="0.6"/>
              <path d="M18 20h20M18 28h14M18 36h10" stroke="url(#wg)" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="40" cy="36" r="6" fill="url(#wg)" opacity="0.9"/>
              <defs>
                <linearGradient id="wg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#38bdf8"/>
                  <stop offset="1" stop-color="#818cf8"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <h1 class="welcome-title">StudyBuddy AI</h1>
          <p class="welcome-subtitle">Your intelligent, rule-based CS mentor.<br>Ask me about any topic, get a roadmap, or just say hi! 👋</p>

          <div class="welcome-chips">
            <button class="chip" data-query="hello">👋 Say Hello</button>
            <button class="chip" data-query="Learn Python">🐍 Python Roadmap</button>
            <button class="chip" data-query="Learn DSA">📊 DSA Guide</button>
            <button class="chip" data-query="Study Tips">📚 Study Tips</button>
            <button class="chip" data-query="Motivate me">🔥 Motivate Me</button>
            <button class="chip" data-query="Help">🗺️ All Topics</button>
          </div>
        </div>

      </div>

      <!-- Typing Indicator -->
      <div class="typing-indicator" id="typingIndicator" aria-label="StudyBuddy is typing">
        <div class="typing-indicator__avatar">SB</div>
        <div class="typing-indicator__dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Input Bar -->
      <footer class="input-bar">
        <div class="input-wrapper">
          <textarea
            id="userInput"
            class="input-field"
            placeholder="Ask me about Python, DSA, AI, study tips..."
            rows="1"
            maxlength="500"
            aria-label="Chat input"
          ></textarea>
          <button class="send-btn" id="sendBtn" aria-label="Send message" title="Send (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
